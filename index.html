<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b100d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Prateleira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Tela única: vídeo da câmera ocupando tudo, moldura de destaque e etiqueta de preço por cima */
:root {
  --night: #0b100d;
  --glass: rgba(11, 16, 13, 0.72);
  --ink: #f2f6f3;
  --muted: #b7c4bc;
  --shelf: #2f7d5e;
  --tag: #ffd84d;
  --tag-ink: #2a2200;
  --warn: #f0b45a;
  --bad: #ff8a7a;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--night); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
#video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--night); }
#reticle {
  position: fixed; left: 50%; top: 42%; width: 46vmin; height: 56vmin; transform: translate(-50%, -50%);
  border: 2px dashed rgba(255,255,255,0.65); border-radius: 18px; pointer-events: none;
  transition: border-color 0.2s ease, opacity 0.2s ease;
}
#reticle.steady { border-style: solid; border-color: var(--tag); }
#reticle.busy { border-style: solid; border-color: var(--tag); animation: pulse 0.9s ease-in-out infinite alternate; }
#reticle.hide { opacity: 0; }
@keyframes pulse { from { box-shadow: 0 0 0 0 rgba(255,216,77,0.0); } to { box-shadow: 0 0 0 10px rgba(255,216,77,0.25); } }
#box {
  position: fixed; border: 3px solid var(--tag); border-radius: 12px; pointer-events: none;
  box-shadow: 0 0 0 9999px rgba(0,0,0,0.28); transition: all 0.25s ease; opacity: 0;
}
#box.on { opacity: 1; }

.top {
  position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px));
  background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0));
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: 0.02em; }
.seg { display: inline-flex; background: var(--glass); border-radius: 999px; padding: 3px; }
.seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: 600 14px var(--font-body); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--night); }
#hint {
  position: fixed; left: 50%; top: calc(42% + 30vmin); transform: translateX(-50%);
  background: var(--glass); color: var(--ink); font-size: 15px; padding: 6px 14px; border-radius: 999px; white-space: nowrap;
}

#card {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px));
  transform: translateY(110%); transition: transform 0.3s ease;
}
#card.on { transform: translateY(0); }
.tag { background: var(--tag); color: var(--tag-ink); border-radius: 8px 8px 16px 16px; padding: 14px 16px 14px; position: relative; display: flex; flex-direction: column; gap: 8px; max-width: 560px; margin: 0 auto; }
.tag::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--shelf); border-radius: 8px 8px 0 0; }
.tag .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
.chip { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; border-radius: 999px; padding: 2px 8px; background: rgba(0,0,0,0.12); }
.chip.alta { background: #1f7a4d; color: #fff; }
.chip.media, .chip.baixa { background: #9a5a00; color: #fff; }
.small { font-size: 12px; opacity: 0.85; }
.tag h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.1; margin: 0; text-wrap: balance; }
.here { font-size: 15px; }
.here strong { font-family: var(--font-display); font-size: 21px; }
.ask { font-size: 14px; background: rgba(0,0,0,0.08); border-radius: 8px; padding: 6px 10px; }
.prices { display: flex; flex-direction: column; gap: 6px; }
.price { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; background: rgba(255,255,255,0.55); border-radius: 8px; padding: 5px 10px; }
.price .rank { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.price .val { font-family: var(--font-display); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; }
.price .src { font-size: 13px; text-align: right; }
.price .less { font-size: 12px; font-weight: 600; color: #1f5a43; }

.screen {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) max(24px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(24px, env(safe-area-inset-left, 0px));
  background: var(--night);
}
.screen h1 { font-family: var(--font-display); font-size: 40px; margin: 0; }
.screen p { margin: 0; color: var(--muted); max-width: 32ch; line-height: 1.5; }
.btn { appearance: none; border: 0; border-radius: 14px; padding: 14px 22px; font: 600 18px var(--font-body); background: var(--tag); color: var(--tag-ink); cursor: pointer; min-width: 220px; }
.btn:focus-visible, .seg button:focus-visible { outline: 3px solid var(--tag); outline-offset: 2px; }
input[type="password"], input[type="text"] { font: 18px var(--font-body); padding: 12px 14px; border-radius: 12px; border: 1px solid #3a4a41; background: #151d18; color: var(--ink); width: min(280px, 100%); text-align: center; }
.err { color: var(--bad); font-size: 15px; }
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 64px); transform: translateX(-50%); background: var(--glass); color: var(--ink); padding: 8px 14px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { #reticle.busy { animation: none; } #card, #box { transition: none; } }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<div id="reticle" aria-hidden="true"></div>
<div id="box" aria-hidden="true"></div>

<div class="top">
  <span class="brand">Prateleira</span>
  <div class="seg" role="group" aria-label="Modo da IA">
    <button type="button" id="mFast" aria-pressed="true">Rápido</button>
    <button type="button" id="mPrecise" aria-pressed="false">Preciso</button>
  </div>
</div>
<div id="hint">Mire num produto e pare um instante</div>
<div id="toast" role="status" hidden></div>
<div id="card" aria-live="polite"></div>

<section class="screen" id="codeScreen" hidden>
  <h1>Prateleira</h1>
  <p>Cole a sua chave gratuita do Google AI Studio. Ela fica guardada só neste celular.</p>
  <form id="codeForm">
    <input type="password" id="codeInput" autocomplete="off" aria-label="Chave do Google AI Studio" placeholder="Cole a chave aqui">
  </form>
  <button class="btn" type="submit" form="codeForm">Começar</button>
  <p><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color: var(--tag)">Pegar a chave no Google AI Studio</a></p>
  <span class="err" id="codeErr" hidden></span>
</section>

<section class="screen" id="startScreen" hidden>
  <h1>Prateleira</h1>
  <p id="startMsg">Toque para abrir a câmera. Aponte para a prateleira e pare sobre um produto.</p>
  <button class="btn" type="button" id="startBtn">Abrir câmera</button>
</section>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const video = $("video");
  const reticle = $("reticle");
  const boxEl = $("box");
  const card = $("card");
  const hint = $("hint");

  const STILL_MS = 600;          // tempo parado antes de consultar
  const STILL_LEVEL = 7;         // diferença média abaixo disso = parado
  const MOVE_LEVEL = 16;         // diferença média acima disso = movendo
  const MIN_GAP_MS = 1200;       // intervalo mínimo entre consultas

  let mode = "rapido";
  let code = "";
  let busy = false;
  let stillSince = 0;
  let needMove = false;          // após um resultado, só consulta de novo depois de mover
  let lastCall = 0;
  let last = null;               // último produto identificado
  let prevFrame = null;
  let wakeLock = null;

  try { code = localStorage.getItem("prateleira-chave-gemini") || ""; } catch (e) {}
  try { mode = localStorage.getItem("prateleira-modo") || "rapido"; } catch (e) {}

  function setMode(m) {
    mode = m;
    $("mFast").setAttribute("aria-pressed", m === "rapido");
    $("mPrecise").setAttribute("aria-pressed", m === "preciso");
    try { localStorage.setItem("prateleira-modo", m); } catch (e) {}
  }
  $("mFast").onclick = () => setMode("rapido");
  $("mPrecise").onclick = () => setMode("preciso");
  setMode(mode);

  let toastT = null;
  function toast(msg, ms) {
    const t = $("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => { t.hidden = true; }, ms || 3500);
  }

  // ---------- Câmera ----------
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      $("startScreen").hidden = true;
      try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
      requestAnimationFrame(loop);
      return true;
    } catch (e) {
      $("startScreen").hidden = false;
      $("startMsg").textContent = (e && e.name === "NotAllowedError")
        ? "A câmera foi bloqueada. Libere o acesso à câmera para este site nas configurações do navegador e toque de novo."
        : "Não foi possível abrir a câmera. Confira se o endereço começa com https e tente de novo.";
      return false;
    }
  }
  $("startBtn").onclick = startCamera;
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && wakeLock === null) {
      try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
    }
  });

  // ---------- Detecção de movimento (no aparelho) ----------
  const small = document.createElement("canvas");
  small.width = 48; small.height = 36;
  const sctx = small.getContext("2d", { willReadFrequently: true });
  let lastSample = 0;

  function motionLevel() {
    sctx.drawImage(video, 0, 0, small.width, small.height);
    const d = sctx.getImageData(0, 0, small.width, small.height).data;
    const g = new Uint8Array(small.width * small.height);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) g[j] = (d[i] * 3 + d[i + 1] * 4 + d[i + 2]) >> 3;
    let diff = 0;
    if (prevFrame) { for (let k = 0; k < g.length; k++) diff += Math.abs(g[k] - prevFrame[k]); diff /= g.length; }
    else diff = 255;
    prevFrame = g;
    return diff;
  }

  function loop(t) {
    requestAnimationFrame(loop);
    if (!video.videoWidth || t - lastSample < 100) return;
    lastSample = t;
    const m = motionLevel();
    if (m > MOVE_LEVEL) {
      stillSince = 0;
      needMove = false;
      if (!busy) { reticle.className = ""; hideBox(); hint.textContent = "Mire num produto e pare um instante"; }
      return;
    }
    if (m < STILL_LEVEL) {
      if (!stillSince) stillSince = t;
      if (!busy && !needMove) reticle.className = "steady";
      if (!busy && !needMove && t - stillSince > STILL_MS && Date.now() - lastCall > MIN_GAP_MS) identify();
    }
  }

  // ---------- Captura do quadro ----------
  const shot = document.createElement("canvas");
  function grabFrame() {
    const iw = video.videoWidth, ih = video.videoHeight;
    const k = Math.min(1, 1280 / Math.max(iw, ih));
    shot.width = Math.round(iw * k); shot.height = Math.round(ih * k);
    shot.getContext("2d").drawImage(video, 0, 0, shot.width, shot.height);
    return shot.toDataURL("image/jpeg", 0.82).split(",")[1];
  }

  // ---------- IA do Google (Gemini, nível gratuito) ----------
  const API = "https://generativelanguage.googleapis.com/v1beta";
  const PREFER = {
    rapido: ["gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "gemini-2.5-flash-lite", "gemini-3.5-flash", "gemini-2.5-flash"],
    preciso: ["gemini-3.5-flash", "gemini-3-flash-preview", "gemini-2.5-flash", "gemini-3.1-flash-lite", "gemini-2.5-flash-lite"]
  };
  let models = null;
  const blocked = new Set();

  async function loadModels() {
    if (models) return models;
    const res = await fetch(API + "/models?pageSize=200", { headers: { "x-goog-api-key": code } });
    if (res.status === 400 || res.status === 401 || res.status === 403) throw { kind: "key" };
    if (!res.ok) throw { kind: "net" };
    const d = await res.json();
    models = (d.models || [])
      .filter((m) => (m.supportedGenerationMethods || []).includes("generateContent"))
      .map((m) => m.name.replace(/^models\//, ""));
    return models;
  }

  function pickModels() {
    const avail = models || [];
    const list = PREFER[mode].filter((n) => avail.includes(n) && !blocked.has(n));
    const extra = avail.filter((n) => /flash/.test(n) && !/image|tts|audio|live|embed|robotics/.test(n) && !blocked.has(n) && !list.includes(n));
    return list.concat(extra);
  }

  function prompt(ultimo) {
    return [
      "Você vê um quadro da câmera de um celular dentro de um supermercado no Brasil.",
      "Olhe primeiro para o centro da imagem, que é para onde a pessoa está apontando.",
      ultimo ? 'O último produto identificado foi: "' + String(ultimo).slice(0, 160) + '".' : "Nenhum produto foi identificado antes.",
      "Responda somente com um objeto JSON, em um destes formatos:",
      '1) Produto no centro: {"tipo":"produto","produto":"nome curto como na embalagem, com marca, versão e tamanho","marca":"","versao":"","tamanho":"ex.: 500 g","confianca":"alta","motivo_duvida":"","preco_etiqueta":null,"box_2d":[ymin,xmin,ymax,xmax]}',
      '2) Só a etiqueta de preço da prateleira no centro: {"tipo":"etiqueta","descricao":"texto da etiqueta","preco":9.99,"corresponde_ao_ultimo":true}',
      '3) Nada identificável: {"tipo":"nada"}',
      "Regras:",
      "- confianca: alta, media ou baixa. Use alta só se marca, versão e tamanho estiverem legíveis.",
      "- Não invente marca, versão ou tamanho que não estejam visíveis. Se faltar algo, deixe vazio, use media ou baixa e explique em motivo_duvida, em uma frase curta.",
      "- preco_etiqueta: preço em reais (número) da etiqueta da prateleira desse mesmo produto, se legível; senão null.",
      "- corresponde_ao_ultimo: true só se a etiqueta for claramente do último produto identificado.",
      "- box_2d: caixa do produto, coordenadas inteiras de 0 a 1000, na ordem [ymin, xmin, ymax, xmax]."
    ].join("\n");
  }

  function parseJSON(t) {
    const a = t.indexOf("{"), b = t.lastIndexOf("}");
    if (a < 0 || b <= a) return null;
    try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { return null; }
  }

  async function askGemini(imageB64, signal) {
    await loadModels();
    const tries = pickModels();
    if (!tries.length) throw { kind: "net" };
    const body = JSON.stringify({
      contents: [{ role: "user", parts: [
        { inline_data: { mime_type: "image/jpeg", data: imageB64 } },
        { text: prompt(last ? last.produto : null) }
      ] }],
      generationConfig: { responseMimeType: "application/json", temperature: 0.1 }
    });
    let lastErr = { kind: "net" };
    for (const name of tries.slice(0, 3)) {
      const res = await fetch(API + "/models/" + name + ":generateContent", {
        method: "POST", signal,
        headers: { "content-type": "application/json", "x-goog-api-key": code },
        body
      });
      if (res.status === 401 || res.status === 403) throw { kind: "key" };
      if (res.status === 429) { blocked.add(name); lastErr = { kind: "limit" }; continue; }
      if (res.status === 404 || res.status === 400) {
        const txt = await res.text().catch(() => "");
        if (/API key not valid|API_KEY_INVALID/i.test(txt)) throw { kind: "key" };
        blocked.add(name); lastErr = { kind: "net" }; continue;
      }
      if (!res.ok) { lastErr = { kind: "net" }; continue; }
      const d = await res.json();
      const parts = (((d.candidates || [])[0] || {}).content || {}).parts || [];
      const text = parts.filter((p) => !p.thought).map((p) => p.text || "").join("");
      const r = parseJSON(text);
      if (!r) throw { kind: "format" };
      if (Array.isArray(r.box_2d) && r.box_2d.length === 4) {
        const [y0, x0, y1, x1] = r.box_2d.map(Number);
        r.caixa = { x: x0 / 1000, y: y0 / 1000, w: (x1 - x0) / 1000, h: (y1 - y0) / 1000 };
      }
      if (typeof r.preco_etiqueta === "string") r.preco_etiqueta = parseFloat(r.preco_etiqueta.replace(",", "."));
      if (typeof r.preco === "string") r.preco = parseFloat(r.preco.replace(",", "."));
      r.modelo = name;
      return r;
    }
    throw lastErr;
  }

  // ---------- Consulta à IA ----------
  async function identify() {
    busy = true;
    lastCall = Date.now();
    reticle.className = "busy";
    hint.textContent = "Identificando…";
    const t0 = performance.now();
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 30000);
    try {
      const data = await askGemini(grabFrame(), ctl.signal);
      handleResult(data, performance.now() - t0);
    } catch (e) {
      if (e && e.kind === "key") { askCode("A chave não foi aceita pelo Google. Confira e cole de novo."); return; }
      toast(e && e.name === "AbortError" ? "A resposta demorou demais. Mova e pare de novo."
        : e && e.kind === "limit" ? "Limite gratuito da IA atingido por agora. Espere um pouco e tente de novo."
        : e && e.kind === "format" ? "A IA respondeu fora do formato. Mova e pare de novo."
        : "Sem resposta da IA. Confira a internet e tente de novo.");
    } finally {
      clearTimeout(timer);
      busy = false;
      needMove = true;
      reticle.className = "hide";
      hint.textContent = "Mova para outro produto";
    }
  }

  function handleResult(r, ms) {
    if (r.tipo === "etiqueta" && last && r.corresponde_ao_ultimo && r.preco > 0) {
      last.preco_etiqueta = r.preco;
      renderCard(last, ms, "Preço local lido da etiqueta.");
      return;
    }
    if (r.tipo !== "produto" || !r.produto) {
      if (r.tipo === "etiqueta") toast("Vi uma etiqueta, mas não tenho certeza de que é do mesmo produto.");
      else toast("Não achei um produto claro. Aproxime e deixe a embalagem de frente.");
      return;
    }
    if (last && last.produto === r.produto && !r.preco_etiqueta && last.preco_etiqueta) r.preco_etiqueta = last.preco_etiqueta;
    last = r;
    showBox(r.caixa);
    renderCard(r, ms);
  }

  // ---------- Destaque do produto ----------
  function showBox(c) {
    if (!c || typeof c.x !== "number") { hideBox(); return; }
    const vw = window.innerWidth, vh = window.innerHeight;
    const iw = video.videoWidth, ih = video.videoHeight;
    const s = Math.max(vw / iw, vh / ih);
    const dw = iw * s, dh = ih * s, ox = (vw - dw) / 2, oy = (vh - dh) / 2;
    const cl = (v) => Math.max(0, Math.min(1, v));
    boxEl.style.left = (ox + cl(c.x) * dw) + "px";
    boxEl.style.top = (oy + cl(c.y) * dh) + "px";
    boxEl.style.width = (cl(c.w) * dw) + "px";
    boxEl.style.height = (cl(c.h) * dh) + "px";
    boxEl.classList.add("on");
  }
  function hideBox() { boxEl.classList.remove("on"); }

  // ---------- Etiqueta de preços ----------
  const fmt = (n) => "R$ " + n.toFixed(2).replace(".", ",");
  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function examplePrices(r) {
    const seed = hash((r.produto || "") + (r.tamanho || ""));
    const ref = r.preco_etiqueta > 0 ? r.preco_etiqueta : 6 + (seed % 3400) / 100;
    const d1 = 0.80 + ((seed >> 8) % 10) / 100;
    const d2 = Math.min(0.98, d1 + 0.04 + ((seed >> 16) % 5) / 100);
    const lojas = ["Mercado A", "Mercado B", "Mercado C", "Mercado D"];
    return [
      { val: ref * d1, loja: lojas[seed % 4], fonte: "nota fiscal" },
      { val: ref * d2, loja: lojas[(seed + 1) % 4], fonte: (seed >> 4) % 2 ? "site" : "nota fiscal" }
    ];
  }
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

  function renderCard(r, ms, note) {
    const conf = ["alta", "media", "baixa"].includes(r.confianca) ? r.confianca : "baixa";
    const tag = el("div", "tag");
    const head = el("div", "head");
    head.append(el("span", "chip " + conf, conf === "alta" ? "certeza alta" : conf === "media" ? "confirme" : "incerto"),
                el("span", "small", (ms / 1000).toFixed(1).replace(".", ",") + " s"));
    tag.append(head, el("h2", "", r.produto));
    if (conf !== "alta" && r.motivo_duvida) tag.append(el("div", "ask", "Confira: " + r.motivo_duvida));
    const here = el("div", "here");
    if (r.preco_etiqueta > 0) {
      here.append(document.createTextNode("Aqui: "), el("strong", "", fmt(r.preco_etiqueta)));
      if (note) here.append(el("span", "small", "  " + note));
    } else {
      here.textContent = "Não vi o preço aqui. Aponte para a etiqueta da prateleira e pare.";
    }
    tag.append(here);
    const list = el("div", "prices");
    examplePrices(r).forEach((p, i) => {
      const row = el("div", "price");
      const mid = el("span", "val", fmt(p.val));
      if (r.preco_etiqueta > 0) { mid.append(el("span", "less", "  " + Math.round((1 - p.val / r.preco_etiqueta) * 100) + "% menos")); }
      row.append(el("span", "rank", (i + 1) + "º"), mid, el("span", "src", p.loja + " · " + p.fonte));
      list.append(row);
    });
    tag.append(list, el("span", "small", "Preços de outros mercados: exemplo, até a base de preços ser conectada."));
    card.textContent = "";
    card.append(tag);
    card.classList.add("on");
  }

  // ---------- Código de acesso ----------
  function askCode(msg) {
    $("codeScreen").hidden = false;
    $("codeErr").hidden = !msg;
    $("codeErr").textContent = msg || "";
    $("codeInput").value = "";
    $("codeInput").focus();
  }
  $("codeForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = $("codeInput").value.trim();
    if (!v) { $("codeErr").textContent = "Cole a chave antes de começar."; $("codeErr").hidden = false; return; }
    code = v;
    try { localStorage.setItem("prateleira-chave-gemini", v); } catch (err) {}
    models = null;
    $("codeScreen").hidden = true;
    if (!video.srcObject) startCamera();
  });

  // ---------- Início ----------
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    $("startScreen").hidden = false;
    $("startMsg").textContent = "Este navegador não oferece câmera ao vivo. Use o Safari no iPhone ou o Chrome no Android, pelo endereço https.";
    $("startBtn").hidden = true;
  } else if (!code) {
    askCode("");
  } else {
    startCamera();
  }
})();
</script>
</body>
</html>
